---
# Install/Manage Galaxy

- name: Galaxy
  hosts: galaxy_servers
  pre_tasks:
    - name: Create local tools dir
      file:
        path: "{{ galaxy_local_tools_dir }}"
        state: directory
        mode: "0755"
      when: galaxy_local_tools is defined
    - name: Create panel_views dir
      file:
        path: "{{ galaxy_config.galaxy.panel_views_dir }}"
        state: directory
        mode: "0755"
    - name: Create additional directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      become: true
      become_user: "{{ galaxy_user }}"
      loop:
        - "{{ galaxy_shared_rw_root }}/tmp/apptainer_cache"
        - "{{ galaxy_shared_rw_root }}/tmp/apptainer_tmp"
    - name: Create shared read-only config dir
      file:
        path: "{{ galaxy_shared_ro_root }}/config"
        state: directory
        mode: "0750"
      become: true
      become_user: "{{ galaxy_user }}"
    - name: Install CFDE data access credential
      ansible.builtin.copy:
        src: files/galaxy/config/cfde-data-access-fdaf817cf042.json
        dest: "{{ galaxy_shared_ro_root }}/config/cfde-data-access-fdaf817cf042.json"
        mode: "{{ galaxy_config_perms }}"
        group: "{{ galaxy_group_name | default(omit) }}"
      become: true
      become_user: "{{ galaxy_user_name }}"
      notify:
        - restart galaxy
  roles:
    - role: galaxyproject.galaxy.venv
    - role: galaxyproject.galaxy.clone
    - role: galaxyproject.galaxy.version
    - role: galaxyproject.galaxy.gravity
    - role: galaxyproject.galaxy.config
      tags: config
    - role: galaxyproject.galaxy.dependencies
    - role: galaxyproject.galaxy.state
      become_user: "{{ galaxy_user_name }}"
    - role: galaxyproject.galaxy.client
    - role: galaxyproject.galaxy.database
      become_user: "{{ galaxy_user_name }}"
  tasks:
    # Runs after the venv role but before handlers, so a rebuilt venv is
    # relabeled before Galaxy restarts. Without bin_t, systemd (init_t) execs
    # galaxyctl (var_t) with no domain transition and Galaxy runs as init_t.
    - name: Set SELinux bin_t file context on Galaxy venv bin dir
      community.general.sefcontext:
        target: "{{ galaxy_venv_dir }}/bin(/.*)?"
        setype: bin_t
        state: present
      vars:
        # seobject is only importable by the system python, not the ansible venv
        ansible_python_interpreter: /usr/bin/python3
      when: ansible_selinux.status != 'disabled'
      tags: selinux

    - name: Apply SELinux file context to Galaxy venv bin dir
      ansible.builtin.command: restorecon -Rv "{{ galaxy_venv_dir }}/bin"
      register: __galaxy_venv_restorecon
      changed_when: __galaxy_venv_restorecon.stdout | length > 0
      when: ansible_selinux.status != 'disabled'
      tags: selinux
  post_tasks:
    # rm -rf instead of file/state=absent: the file module's output is too
    # noisy here, and hiding it with no_log also hid why the task sometimes failed.
    - name: Remove node_modules
      ansible.builtin.command: rm -rf "{{ galaxy_server_dir }}/client/node_modules"
      changed_when: false

    - name: Find plugin node_modules
      find:
        paths: "{{ galaxy_server_dir }}/config/plugins"
        recurse: true
        depth: 4    # should get plugins in plugin collection dirs
        patterns: node_modules
        file_type: directory
      register: __galaxy_node_modules_dirs_result

    - debug:
        var: __galaxy_node_modules_dirs_result.files

    - name: Remove plugin node_modules
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ __galaxy_node_modules_dirs_result.files }}"
      diff: false

    - name: Deploy internal tools
      ansible.posix.synchronize:
        src: "{{ galaxy_server_dir }}/tools/"
        dest: "{{ galaxy_config.galaxy.tool_path }}"
        archive: true
        delete: true
      become_user: "{{ galaxy_user }}"
      delegate_to: "{{ inventory_hostname }}"

    - name: Create job_execution venv for galaxy-set-metadata
      ansible.builtin.pip:
        name:
          - pip
          - wheel
        state: latest
        virtualenv: "{{ job_execution_venv }}"
        virtualenv_command: "{{ pip_virtualenv_command }}"
      become_user: "{{ galaxy_user }}"

    - name: Install galaxy-job-execution and extras
      ansible.builtin.pip:
        name: "{{ job_execution_packages }}"
        virtualenv: "{{ job_execution_venv }}"
      become_user: "{{ galaxy_user }}"

    - name: Slurp data_fetch.py
      ansible.builtin.slurp:
        src: "{{ galaxy_server_dir }}/lib/galaxy/tools/data_fetch.py"
      register: __galaxy_data_fetch_tool_src

    - name: Install galaxy-data-fetch tool
      ansible.builtin.copy:
        content: |
          #!{{ job_execution_venv }}/bin/python3
          {{ __galaxy_data_fetch_tool_src['content'] | b64decode }}
        dest: "{{ job_execution_venv }}/bin/galaxy-data-fetch"
        mode: "0755"
      become_user: "{{ galaxy_user }}"

    - name: Copy welcome.html
      ansible.builtin.copy:
        src: files/galaxy/static/welcome.html
        dest: "{{ galaxy_static_dir }}/welcome.html"
        mode: "0644"
      tags: welcome

    - name: Create cleanup scripts dir
      ansible.builtin.file:
        path: "{{ galaxy_cleanup_bin_dir }}"
        state: directory
        mode: "0755"
      when: "inventory_hostname in groups['galaxy_cleanup_servers']"
      tags: cleanup

    - name: Install cleanup scripts
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ galaxy_cleanup_bin_dir }}/{{ item.dest }}"
        mode: "0755"
      loop:
        - src: cron/cleanup_galaxy_all.sh.j2
          dest: cleanup_galaxy_all.sh
        - src: admin/pulsar-clean-jobs.j2
          dest: pulsar-clean-jobs
        - src: admin/galaxy-clean-job-dirs.j2
          dest: galaxy-clean-job-dirs
      when: "inventory_hostname in groups['galaxy_cleanup_servers']"
      tags: cleanup

    - name: Schedule cleanup cron jobs
      ansible.builtin.include_role:
        name: galaxyproject.general.cron
        apply:
          tags: cleanup
      tags: cleanup
